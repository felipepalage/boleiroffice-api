services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Boleiroffice
      POSTGRES_USER: boleiroffice
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boleiroffice -d Boleiroffice"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=Boleiroffice;Username=boleiroffice;Password=${DB_PASSWORD}"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Cors__AllowedOrigins__0: "${FRONTEND_URL}"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDataOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
